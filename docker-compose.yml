services:
  postgres:
    container_name: jobqueue_postgres
    image: postgres:15
    restart: unless-stopped
    command: ["postgres", "-p", "${POSTGRES_PORT:-5433}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jobqueue}
    ports:
      - "${POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5433}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -p ${POSTGRES_PORT:-5433} -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jobqueue}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network


  migrate:
    container_name: jobqueue_migrate
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5433/jobqueue}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - app_network

  app:
    container_name: jobqueue_app
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5433/jobqueue}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_PORT: ${APP_PORT:-8000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('APP_PORT', '8000') + '/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    command: ["/app/docker/app-start.sh"]
    networks:
      - app_network

  worker:
    container_name: jobqueue_worker
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5433/jobqueue}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_TASK_TIMEOUT: ${WORKER_TASK_TIMEOUT:-600}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      WORKER_MAX_TASKS: ${WORKER_MAX_TASKS:-1000}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-30}
      WORKER_NAME: ${WORKER_NAME:-Worker-1}
    volumes:
      - ./uploads:/app/uploads
    command: ["/app/docker/worker-start.sh"]
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    networks:
      - app_network

  frontend:
    container_name: jobqueue_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    name: ${COMPOSE_NETWORK_NAME:-jobqueue_network}
