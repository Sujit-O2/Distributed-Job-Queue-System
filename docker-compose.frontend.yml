services:
  frontend:
    container_name: jobqueue_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${FRONTEND_STANDALONE_PORT:-3001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app_network

networks:
  app_network:
    external: true
    name: ${COMPOSE_NETWORK_NAME:-jobqueue_network}
